<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1019">
<title>機甲戦線グランヴァルド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: 1画面に収める（スクロールなし）。上のバー／マップ（空いた高さに合わせて拡大縮小）／高さ固定のコンソール。コマンドはマップ上のポップアップ */
:root{
  color-scheme:dark;
  --bg:#0a1019; --panel:#121b29; --panel2:#192539; --line:#2a3b55;
  --fg:#e6edf7; --mute:#8798b0; --ally:#45aaff; --foe:#ff5163; --amber:#ffc23d; --good:#5fe08a;
  --disp:'DotGothic16','Zen Kaku Gothic New',monospace;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
/* セーフエリアの余白は #app の padding で取る（ここでも取ると二重になり、画面の下が切れる） */
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--body);color:var(--fg)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:600px;height:100vh;height:100dvh;margin:0 auto;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:8px}
.turn{font-family:var(--disp);font-size:15px;letter-spacing:.06em}
.phase{font-family:var(--disp);font-size:12px;padding:3px 8px;border-radius:3px;letter-spacing:.12em;background:color-mix(in srgb,var(--ally) 22%,transparent);color:var(--ally);border:1px solid color-mix(in srgb,var(--ally) 50%,transparent)}
.phase.enemy{background:color-mix(in srgb,var(--foe) 22%,transparent);color:var(--foe);border-color:color-mix(in srgb,var(--foe) 50%,transparent)}
.sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--mute)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ally);border-color:var(--ally);color:#06121f}
.btn.warn{background:var(--foe);border-color:var(--foe);color:#1a0508}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
#mapwrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#mapbox{position:relative;line-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
#map{display:block;touch-action:manipulation}
#pop{position:absolute;z-index:5;display:flex;flex-direction:column;gap:5px;line-height:normal;width:104px}
#pop .btn{min-height:44px;padding:6px 8px;font-size:15px;box-shadow:0 4px 14px #000b;border-color:#3d5578}
#pop .btn.pri{border-color:var(--ally)}
#pop .btn:disabled{opacity:1;background:#141c29;color:#56647a;border-color:var(--line)}
#console{flex:none;height:124px;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.uhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.btn.xs{padding:4px 10px;min-height:28px;font-size:12px;margin-left:auto;align-self:center;border-color:var(--ally);color:var(--ally)}
.st-top{display:flex;gap:12px;align-items:center}
.st-top img{width:84px;height:84px;object-fit:contain;flex:none;image-rendering:pixelated}
.st-sec{font-family:var(--disp);font-size:13px;color:var(--mute);margin:12px 0 6px;letter-spacing:.06em}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.st-grid div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding:3px 0;color:var(--mute)}
.st-grid em{font-style:normal;font-family:var(--disp);color:var(--fg)}
.wtab{overflow-x:auto}
.wtab table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wtab th{color:var(--mute);font-weight:400;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.wtab td{padding:5px 6px;border-bottom:1px solid var(--line)}
.wtab tr.ng td{opacity:.45}
.roster{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ally);border-radius:6px;padding:6px 10px;cursor:pointer;width:100%}
.rrow.foe{border-left-color:var(--foe)}
.rrow.dead{opacity:.4}
.rrow img{width:36px;height:36px;object-fit:contain;grid-row:span 2;image-rendering:pixelated}
.rrow .n{font-weight:700;font-size:13px}
.rrow .h{font-family:var(--disp);font-size:12px;text-align:right}
.rrow .d{font-size:11px;color:var(--mute)}
.uname{font-family:var(--disp);font-size:16px}
.upil{color:var(--mute);font-size:13px}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute)}
.tag.ally{color:var(--ally);border-color:color-mix(in srgb,var(--ally) 50%,transparent)}
.tag.foe{color:var(--foe);border-color:color-mix(in srgb,var(--foe) 50%,transparent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12px}
.meter{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.meter b{font-family:var(--disp);font-weight:400;width:22px;color:var(--mute)}
.meter .track{flex:1;height:6px;background:#00000066;border-radius:2px;overflow:hidden}
.meter .fill{height:100%}
.meter span{min-width:76px;text-align:right;font-family:var(--disp)}
.kv{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.kv em{font-style:normal;color:var(--fg);font-family:var(--disp)}
.ticon{height:18px;vertical-align:-5px;margin-right:3px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 6px;border-radius:10px;background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto;min-height:38px;padding:6px 10px}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wtab{flex:1 1 calc(50% - 6px);text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px}
.wtab small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.wtab.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.hint{font-size:13px;color:var(--mute);line-height:1.55}
/* sheets */
#sheet{position:fixed;inset:auto 0 0 0;z-index:65;display:flex;justify-content:center;pointer-events:none}
#sheet .in{pointer-events:auto;width:100%;max-width:600px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:72vh;overflow:auto;box-shadow:0 -10px 40px #000a;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh-title{font-family:var(--disp);font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.wlist{display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;width:100%}
.wrow:disabled{opacity:.4;cursor:default}
.wrow .n{font-weight:700;font-size:14px}
.wrow .p{font-family:var(--disp);font-size:16px;text-align:right}
.wrow .d{grid-column:1/-1;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.wrow .d .ng{color:var(--foe)}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc .side{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px}
.fc .side.a{border-top:3px solid var(--ally)}
.fc .side.e{border-top:3px solid var(--foe)}
.fc .nm{font-family:var(--disp);font-size:14px;margin-bottom:4px}
.fc .wp{font-size:12px;color:var(--mute);margin-bottom:6px;min-height:1.3em}
.fc .big{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);align-items:baseline}
.fc .big em{font-style:normal;font-family:var(--disp);font-size:20px;color:var(--fg)}
.fc .big em.hi{color:var(--good)}
.sh-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sh-actions .btn{flex:1}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.toggle small{display:block;color:var(--mute);font-size:12px}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:6px;align-items:stretch}
.slot .wrow{flex:1}
.slot .del{flex:none;min-width:58px}
.slot .ng{color:var(--foe)}
.confirm{font-size:15px;line-height:1.7;margin:4px 0 2px}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050910ee;padding:16px}
#battle,#dialog{justify-content:flex-start;padding-top:max(12vh,env(safe-area-inset-top,0px))}
#battle .stage{width:min(100%,680px);position:relative}
#bcv{width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:#000}
.msg{width:min(100%,680px);margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;height:96px;overflow:hidden}
.msg .who{font-family:var(--disp);font-size:13px;color:var(--amber);margin-bottom:4px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .mtx{flex:1;min-width:0}
.face{width:72px;height:72px;flex:none;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:var(--panel2)}
.st-pilot{display:flex;gap:12px;align-items:center;margin-top:4px}
.st-pilot .face{width:88px;height:88px}
.msg .txt{font-size:15px;line-height:1.6}
.skip{margin-top:8px;font-size:12px;color:var(--mute)}
#banner{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;pointer-events:none}
#banner .b{font-family:var(--disp);font-size:clamp(28px,8vw,48px);letter-spacing:.18em;padding:14px 0;width:100%;text-align:center;background:linear-gradient(90deg,transparent,#000c 20%,#000c 80%,transparent);animation:ban 1.2s ease-in-out forwards}
#banner .b small{display:block;font-size:13px;letter-spacing:.3em;color:var(--mute)}
@keyframes ban{0%{opacity:0;transform:translateX(-40px)}20%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40px)}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-size:13px;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#title .logo{font-family:var(--disp);font-size:clamp(30px,9vw,54px);letter-spacing:.08em;text-align:center;line-height:1.2;text-wrap:balance}
#title .logo small{display:block;font-size:13px;letter-spacing:.4em;color:var(--amber);margin-bottom:8px}
#title .sub{color:var(--mute);margin:14px 0 22px;text-align:center;font-size:14px;line-height:1.8;max-width:30em}
#title canvas{width:min(100%,420px);aspect-ratio:2/1;margin-bottom:10px}
#title .stages{display:flex;flex-direction:column;gap:8px;margin-top:16px;width:min(100%,320px)}
#title .stages .btn{text-align:left;padding:8px 14px;min-height:52px}
#title .stages .btn small{display:block;font-weight:400;font-size:11.5px;opacity:.8;margin-top:1px}
.dlg{cursor:pointer}
#dialog.solid{background:var(--bg)}
/* 会話の背景画（BG）。背景があるときは文字枠を下に置く */
#dialog.hasbg{justify-content:flex-end;padding-bottom:max(7vh,env(safe-area-inset-bottom,0px));background-color:#000;background-size:cover;background-position:center}
#dialog .msg{height:auto;min-height:96px}
#dialog.hasbg .msg{background:#0b1220e8}
#dialog.hasbg .skip{color:#dfe7f2;text-shadow:0 1px 3px #000}
#dialog.narr .txt{color:#c3cfdf;font-size:14px;line-height:1.8}
@media (prefers-reduced-motion:reduce){#banner .b,#sheet .in{animation:none}}
</style>

<div id="app">
  <div class="bar">
    <span class="turn" id="turnLbl">TURN 1</span>
    <span class="phase" id="phaseLbl">PLAYER</span>
    <span class="sp"></span>
    <button class="btn sm" id="btnRoster" aria-label="部隊一覧">部隊</button>
    <button class="btn sm" id="btnCfg" aria-label="設定">設定</button>
    <button class="btn sm pri" id="btnEnd">ターン終了</button>
  </div>
  <div id="mapwrap"><div id="mapbox"><canvas id="map" aria-label="戦闘マップ"></canvas><div id="pop" hidden></div></div></div>
  <div id="console"></div>
</div>
<div id="sheet" hidden></div>
<div id="banner" hidden></div>
<div id="toast" style="opacity:0"></div>

<div id="battle" class="ov" hidden>
  <div class="stage"><canvas id="bcv"></canvas></div>
  <div class="msg"><img class="face" id="bFace" alt="" hidden><div class="mtx"><div class="who" id="bWho"></div><div class="txt" id="bTxt"></div></div></div>
  <div class="skip">タップでスキップ</div>
</div>

<div id="dialog" class="ov dlg" hidden>
  <div class="msg" style="max-width:600px"><img class="face" id="dFace" alt="" hidden><div class="mtx"><div class="who" id="dWho"></div><div class="txt" id="dTxt"></div></div></div>
  <div class="skip">タップで次へ</div>
</div>

<div id="title" class="ov">
  <canvas id="tcv"></canvas>
  <div class="logo">機甲戦線<br>グランヴァルド</div>
  <div class="stages" id="stageList"></div>
  <button class="btn" id="btnContinue" style="min-width:240px;font-size:15px;margin-top:10px">続きから</button>
  <div class="skip">BGM：まんぼう二等兵 ほか（フリー素材）</div>
</div>

function usable(u,w){

    const tone=(f1,f2,dur,wave='square',vol=.06)=>{const o=AC.createOscillator();o.type=wave;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);o.start(t);o.stop(t+dur)};

    ({sel:()=>tone(880,1200,.05),ok:()=>tone(660,990,.08),cancel:()=>tone(500,300,.07),move:()=>tone(300,420,.06,'triangle',.05),
      beam:()=>tone(1400,200,.35,'sawtooth',.05),slash:()=>noise(.18,.12,5000),hit:()=>noise(.25,.22,2200),boom:()=>noise(.8,.3,700),
      miss:()=>tone(900,300,.2,'sine',.06),spirit:()=>{tone(520,1560,.3,'triangle',.07)},phase:()=>tone(440,880,.25,'triangle',.07)})[type]?.();

function fadeTo(a,v,ms,done){clearInterval(a._f);const v0=a.volume,t0=performance.now();a._f=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=v0+(v-v0)*k;if(k>=1){clearInterval(a._f);done&&done()}},30)}
function bgm(name){
  bgmCur=name;const vol=BGM_VOL[settings.bgmVol]??BGM_VOL[2];
  for(const[k,a]of Object.entries(BGM)){
    if(k===name&&vol>0&&!document.hidden){if(a.paused){a.volume=0;a.play().catch(()=>{})}fadeTo(a,vol,400)}
    else if(!a.paused)fadeTo(a,0,400,()=>a.pause());
  }
}
// iOS では曲ごとにタップ中の再生が必要なので、出撃ボタンで両方を一度鳴らしておく
function unlockBgm(){for(const a of Object.values(BGM)){a.volume=0;a.play().then(()=>{if(bgmCur!==a._name)a.pause()}).catch(()=>{})}}
for(const[k,a]of Object.entries(BGM))a._name=k;
document.addEventListener('visibilitychange',()=>{if(bgmCur)bgm(bgmCur)});

const consoleEl=$('console'),sheet=$('sheet'),pop=$('pop');
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1800)}
function meter(lbl,v,max,color){return`<div class="meter"><b>${lbl}</b><div class="track"><div class="fill" style="width:${100*v/max}%;background:${color}"></div></div><span>${v}/${max}</span></div>`}
function unitCard(u,compact){

// 移動後のコマンドは、ユニットの横に出すポップアップにまとめる（親指で押しやすい位置）

function placePop(){

  pop.style.left=clamp(x,4,mw-pw-4)+'px';pop.style.top=y+'px';

// 会話を1行ずつ表示する。narr はナレーション（名前なし）。solid:true はマップを隠す（戦闘前・クリア後の場面）

 '鷹野 迅':'jin','天城 ミオ':'mio','岩瀬 ゴウ':'gou','風間 リク':'riku','総帥ザルグ':'zarg'};

/* ================= PLAYER INPUT ================= */
cv.addEventListener('click',e=>{
  if(busy||phase!=='player'||over)return;
  const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/(r.width/COLS)),y=Math.floor((e.clientY-r.top)/(r.height/ROWS));
  if(x<0||y<0||x>=COLS||y>=ROWS)return;
  onTile(x,y);
});
const attackable=u=>alive('foe').filter(e=>u.weapons.some(w=>!usable(u,w)&&inRange(w,dist(u,e))));
async function onTile(x,y){
  const u=unitAt(x,y);
  if(mode==='idle'||mode==='peek'){
    if(u&&u.team==='ally'&&!u.acted){selectUnit(u);return}
    if(u){snd('sel');info={u};sel=null;
      if(u.team==='foe'){reach=computeReach(u,u.guard&&turn<3);const at=[];for(let yy=0;yy<ROWS;yy++)for(let xx=0;xx<COLS;xx++){if(reach.has(xx,yy))continue;if(reach.tiles.some(t=>u.weapons.some(w=>inRange(w,Math.abs(t.x-xx)+Math.abs(t.y-yy)))))at.push({x:xx,y:yy})}info.attackTiles=at;mode='peek'}
      else{reach=null;mode='idle'}
    }else{info=null;reach=null;mode='idle'}
    renderConsole();return;
  }
  if(mode==='select'){
    if(x===sel.x&&y===sel.y){toMenu(false);return}
    if(u&&u.team==='foe'){attackFromSelect(u);return}
    if(reach.has(x,y)){await moveSel(x,y);toMenu(true);return}
    if(u&&u.team==='ally'&&!u.acted){selectUnit(u);return}
    cancelSel();return;
  }
  if(mode==='menu'){
    if(u&&u.team==='foe'){if(attackable(sel).includes(u))forecast(sel,u,bestWeapon(sel,u,dist(sel,u)));else toast('その敵には届きません');}
    return;
  }
  if(mode==='target'){
    const t=targets&&targets.find(t=>t.x===x&&t.y===y);
    if(t){if(tgtKind==='attack')forecast(sel,t,bestWeapon(sel,t,dist(sel,t)));else if(tgtKind==='supply')doSupply(sel,t);else doRepair(sel,t);return}
    snd('cancel');mode='menu';targets=null;renderConsole();
  }
}
async function moveSel(x,y){
  busy=true;origin={x:sel.x,y:sel.y};const path=reach.path(x,y);reach=null;mode='moving';renderConsole();
  await animateMove(sel,path);sel.moved=true;sel._accel=!!sel.buf.accel;delete sel.buf.accel;busy=false;
}
// 選択中に敵をタップ：攻撃が届くマスのうち、与ダメージが大きく反撃を受けにくいマスへ移動してから戦闘予測を出す
async function attackFromSelect(e){
  const a=sel,ox=a.x,oy=a.y;let best=null;
  for(const t of reach.tiles){
    a.x=t.x;a.y=t.y;const d=dist(a,e);
    for(const w of a.weapons){if(usable(a,w)||!inRange(w,d))continue;
      const cw=bestWeapon(e,a,d);
      const sc=baseDmg(a,e,w)*hitRate(a,e,w)/100-(cw?baseDmg(e,a,cw)*hitRate(e,a,cw)/100*.5:0)+(t.x===ox&&t.y===oy?50:0)+(a.air?0:terOf(t.x,t.y).d*400);
      if(!best||sc>best.sc)best={sc,t,w}}
  }
  a.x=ox;a.y=oy;
  if(!best){snd('cancel');toast('この敵に届く位置がありません');return}
  if(best.t.x!==ox||best.t.y!==oy)await moveSel(best.t.x,best.t.y);else origin={x:ox,y:oy};
  reach=null;mode='menu';renderConsole();forecast(a,e,best.w);
}
function selectUnit(u){snd('sel');sel=u;info=null;origin={x:u.x,y:u.y};reach=computeReach(u);mode='select';renderConsole()}
function cancelSel(){snd('cancel');sel=null;reach=null;mode='idle';info=null;renderConsole()}
function toMenu(moved){snd('ok');if(!moved)origin={x:sel.x,y:sel.y};reach=null;mode='menu';renderConsole()}
// 補給：弾数かENが減っている隣の味方
function needsSupply(a){return a.en<a.maxEn||a.weapons.some(w=>w.maxAmmo&&w.ammo<w.maxAmmo)}
function supplyTargets(u){return alive('ally').filter(a=>a!==u&&dist(a,u)===1&&needsSupply(a))}
function repairTargets(u){return alive('ally').filter(a=>a!==u&&dist(a,u)===1&&a.hp<a.maxHp)}
function onAction(e){
  const b=e.target.closest('[data-a]');if(!b||b.disabled||busy)return;
  const a=b.dataset.a;
  if(a==='cancel')cancelSel();
  else if(a==='stay')toMenu(false);
  else if(a==='spirit')spiritSheet(sel);
  else if(a==='attack'){snd('ok');tgtKind='attack';targets=attackable(sel);mode='target';renderConsole()}
  else if(a==='repair'){snd('ok');tgtKind='repair';targets=repairTargets(sel);mode='target';renderConsole()}
  else if(a==='supply'){snd('ok');tgtKind='supply';targets=supplyTargets(sel);mode='target';renderConsole()}
  else if(a==='wait')finishUnit(sel);
  else if(a==='undo'){snd('cancel');sel.x=origin.x;sel.y=origin.y;sel.moved=false;if(sel._accel)sel.buf.accel=1;reach=computeReach(sel);mode='select';renderConsole()}
  else if(a==='backmenu'){snd('cancel');targets=null;mode='menu';renderConsole()}
  else if(a==='status'){const u=units.find(v=>v.id===+b.dataset.uid);if(u)statusSheet(u)}
}
consoleEl.addEventListener('click',onAction);
pop.addEventListener('click',onAction);
function finishUnit(u){u.acted=true;sel=null;reach=null;targets=null;mode='idle';info=null;closeSheet();renderConsole();
  // 400ms の間にロードされることもあるので、実行時にもう一度確かめる
  if(!over&&alive('ally').every(a=>a.acted))setTimeout(()=>{if(phase==='player'&&!busy&&!over&&alive('ally').every(a=>a.acted))endPlayerPhase()},400)}
function spiritSheet(u){
  snd('sel');
  const rows=u.pilot.spirits.map(n=>{const s=SPIRITS[n];let ng='';
    if(u.sp<s.cost)ng='SP不足';else if(s.key&&u.buf[s.key])ng='効果中';else if(n==='加速'&&(u.moved||mode!=='select'))ng='移動前のみ';else if(n==='根性'&&u.hp>=u.maxHp)ng='HP満タン';else if(n==='気合'&&u.will>=150)ng='気力上限';
    return`<button class="wrow" data-sp="${n}" ${ng?'disabled':''}><span class="n">${n}</span><span class="p">${s.cost}</span><span class="d">${s.desc}${ng?` <span class="ng">— ${ng}</span>`:''}</span></button>`}).join('');
  openSheet(`<div class="sh-title"><span>精神コマンド　${u.pilot.name}</span><span style="color:var(--amber)">SP ${u.sp}/${u.maxSp}</span></div><div class="wlist">${rows}</div><div class="sh-actions"><button class="btn" data-x="close">閉じる</button></div>`);

function forecastHtml(a,d,w,mode){
  const dist_=dist(a,d),cw=mode==='counter'?bestWeapon(d,a,dist_):null;
  const side=(u,wp,vs,cls,m)=>{const hr=wp?hitRate(u,vs,wp,m):0,dm=wp?baseDmg(u,vs,wp,null):0;

  return{html:`<div class="fc">${side(a,w,d,a.team==='ally'?'a':'e',mode)}${side(d,cw,a,d.team==='ally'?'a':'e',null)}</div>`,cw};
}
// 戦闘予測。届く武器をタブで切り替えられる
function forecast(a,d,w){
  snd('sel');
  const f=forecastHtml(a,d,w,'counter'),dd=dist(a,d);
  const tabs=a.weapons.map((x,i)=>usable(a,x)||!inRange(x,dd)?'':`<button class="wtab ${x===w?'on':''}" data-fw="${i}">${x.name}<small>攻撃 ${x.pow}・命中 ${hitRate(a,d,x)}%・${x.maxAmmo?`弾 ${x.ammo}`:x.en?`EN ${x.en}`:'消費なし'}</small></button>`).join('');
  openSheet(`<div class="sh-title"><span>戦闘予測</span><span style="color:var(--mute);font-size:12px">${a.buf.dbl?'熱血 ':''}${a.buf.hit100?'必中 ':''}</span></div><div class="wtabs">${tabs}</div>${f.html}<div class="sh-actions"><button class="btn pri" data-x="go">攻撃開始</button><button class="btn" data-x="close">やめる</button></div>`);

// ユニットの詳細ステータス（敵味方どちらも見られる）
function sprSrc(u){return`assets/sprites/${u.key}.png`}
function statusSheet(u,fromRoster){
  snd('sel');
  const t=terOf(u.x,u.y),P=u.pilot,ally=u.team==='ally';
  const g=(k,v)=>`<div>${k}<em>${v}</em></div>`;

/* ================= COMBAT ================= */
async function combat(att,def,w,choice){
  // ステージの会話イベント（それぞれ1回だけ）
  for(const t of ST.talks||[])if(!flags[t.id]&&t.when(att,def)){flags[t.id]=true;await dialog(t.lines(att,def))}
  att.dir=dirOf(def.x-att.x,def.y-att.y);def.dir=dirOf(att.x-def.x,att.y-def.y);
  const strikes=[strike(att,def,w,choice.mode)];
  if(def.hp>0&&choice.mode==='counter'){const cw=bestWeapon(def,att,dist(att,def));if(cw)strikes.push(strike(def,att,cw,'counter'))}
  att._atk=true;
  if(settings.anim)await playBattle(att,def,strikes);
  else{for(const s of strikes){snd(s.hit?'hit':'miss');floats.push({x:s.def.x,y:s.def.y,text:s.hit?(s.crit?'!':'')+s.dmg:'MISS',color:s.hit?'#fff':'#9fb3cc',t0:performance.now()});await sleep(650)}}
  delete att._atk;
  for(const u of[att,def])if(u.hp<=0&&!u.dead){u.dead=true;mapFx.push({x:u.x,y:u.y,t0:performance.now()});snd('boom')}
  checkBonus();
  await sleep(250);
  await checkEnd();
}
// ボーナス条件（ST.bonus）：決められたターンの終わりまでに、指定の地形（村＝市街）の上の敵がいなくなったか
function checkBonus(){
  const b=ST.bonus;if(!b||flags.bonus||turn>b.turn)return;
  if(!alive('foe').some(e=>MAP[e.y][e.x]===b.tile))flags.bonus=true;
}
async function checkEnd(){
  if(over)return;
  const boss=units.find(u=>u.boss),leader=units.find(u=>u.key===ST.leader);
  if(leader.dead||!alive('ally').length){over=true;await sleep(500);await dialog(ST.lose);result(false);return}
  if(boss.dead||!alive('foe').length){over=true;await sleep(500);
    await dialog(boss.dead&&alive('foe').length?ST.bossDown:ST.allDown);
    if(ST.epilogue)await dialog(ST.epilogue(flags),{solid:true});
    result(true)}
}
function result(win){
  bgm(null);
  const el=document.createElement('div');el.className='ov';el.innerHTML=`<div class="logo" style="font-family:var(--disp);font-size:clamp(32px,9vw,52px);letter-spacing:.12em;color:${win?'var(--amber)':'var(--foe)'}">${win?'MISSION CLEAR':'GAME OVER'}</div>
  <div class="sub" style="color:var(--mute);margin:14px 0 22px;text-align:center;line-height:1.8">${stageTitle(ST)}<br>${win?`クリアターン数 ${turn}<br>撃墜数 ${units.filter(u=>u.team==='foe'&&u.dead).length} / ${units.filter(u=>u.team==='foe').length}${ST.bonus?`<br>村の防衛 ${flags.bonus?'達成':'未達成'}`:''}`:ST.loseHint}</div>
  <button class="btn pri" style="min-width:180px">${win?'もう一度プレイ':'リトライ'}</button>
  <button class="btn" data-r="title" style="min-width:180px;margin-top:10px">タイトルへ</button>
  <button class="btn" data-r="load" style="min-width:180px;margin-top:10px" ${hasSave()?'':'disabled'}>ロード</button>`;
  el.id='result';document.body.appendChild(el);el.querySelector('.pri').onclick=()=>{el.remove();startGame(ST.id)};
  el.querySelector('[data-r=load]').onclick=()=>{snd('sel');loadSheet()};

}

/* ================= BATTLE SCENE ================= */
const bcv=$('bcv'),bctx=bcv.getContext('2d');
function playBattle(att,def,strikes){
  return new Promise(resolve=>{
    const ov=$('battle');ov.hidden=false;
    const W_=bcv.clientWidth||640;const dpr=Math.min(1.5,window.devicePixelRatio||1);bcv.width=Math.round(W_*dpr);bcv.height=Math.round(W_*.56*dpr);
    const w=bcv.width,h=bcv.height;
    const L=att.team==='foe'?att:def,R=L===att?def:att; // enemy left, ally right
    const start={};start[att.id]=strikes.length>1?strikes[1].hpFrom:att.hp;start[def.id]=strikes[0].hpFrom;
    const D=1900;const total=strikes.length*D+500;let t0=performance.now(),done=false,parts=[],flash=0,shake=0,lastI=-1,impacted=-1;
    const terr=terOf(def.x,def.y);const sky=terr===TER.W?['#0f2f5c','#2f74b8','#164a7a']:terr===TER.F?['#0e2a1c','#3c7a4e','#21452c']:terr===TER.M?['#2b2440','#8a6a5a','#4a3c30']:terr===TER.C?['#121a30','#4a5a80','#2a3040']:terr===TER.E?['#1a0a12','#6a2a3a','#3a2a2e']:['#10213a','#4f7fb0','#2f4f2f'];
    // 背景のグラデーションは戦闘ごとに1回だけ描いておく（毎フレーム作ると端末が重くなる）
    const bg=document.createElement('canvas');bg.width=w+40;bg.height=h+40;{const bx=bg.getContext('2d'),g=bx.createLinearGradient(0,20,0,h+20);g.addColorStop(0,sky[0]);g.addColorStop(.62,sky[1]);g.addColorStop(.62,sky[2]);g.addColorStop(1,'#000');bx.fillStyle=g;bx.fillRect(0,0,w+40,h+40)}
    function finish(){if(done)return;done=true;ov.hidden=true;ov.onclick=null;resolve()}
    ov.onclick=finish;
    function sidePos(u){return u===L?{x:w*.25,y:h*.52,f:1}:{x:w*.75,y:h*.52,f:-1}}
    function frame(now){
      if(done)return;
      const el=Math.max(0,now-t0);if(el>total){finish();return}
      const i=Math.min(strikes.length-1,Math.floor(el/D)),k=(el-i*D)/D,s=strikes[i];
      if(i!==lastI){lastI=i;setFace($('bFace'),s.att.pilot.name);$('bWho').textContent=s.att.pilot.name;$('bTxt').textContent=`「${s.line}」　${s.w.name}！`;snd(s.w.type==='格'?'slash':'beam')}
      const A=sidePos(s.att),T=sidePos(s.def),melee=s.w.type==='格';
      const impactK=melee?.5:.58;
      if(k>=impactK&&impacted<i&&el<strikes.length*D){impacted=i;
        if(s.hit){flash=1;shake=s.crit?1:.6;snd('hit');for(let n=0;n<26;n++)parts.push({x:T.x,y:T.y-h*.05,vx:(Math.random()-.5)*w*.012,vy:(Math.random()-.8)*h*.02,life:1,c:Math.random()<.5?'#fff2b0':'#ff9a3d'})}
        else snd('miss')}
      // hp interp
      const disp={...start};
      for(let j=0;j<strikes.length;j++){const sj=strikes[j];const sk=j<i?1:j>i?0:clamp((k-impactK)/.2,0,1);if(j<=i)disp[sj.def.id]=Math.round(sj.hpFrom+(sj.hpTo-sj.hpFrom)*sk)}
      // background
      const c=bctx;c.save();
      if(shake>0){c.translate((Math.random()-.5)*w*.02*shake,(Math.random()-.5)*h*.02*shake);shake*=.9}
      c.drawImage(bg,-20,-20);
      c.strokeStyle='#ffffff22';c.lineWidth=2*dpr;for(let n=0;n<14;n++){const yy=(n*73%100)/100*h*.6,xx=((n*137+el*.9*(A.f))%(w*1.4))-w*.2;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx-A.f*w*.12,yy);c.stroke()}
      // 足場：そのユニットがいるマスの地形タイル。回避や突進で機体が動いても地面は動かさない。
      // 機体より先に両方の足場を描くので、突進した機体が相手の足場に隠れることもない
      for(const u of[L,R]){
        const p=sidePos(u),gone=strikes.some((sj,j)=>j<i&&sj.kill&&sj.def===u);
        const ti=TER_IMG[MAP[u.y][u.x]];
        c.save();c.translate(p.x,p.y);
        if(ready(ti)&&!(u.air&&u===s.att&&melee)){const pw=h*.52,ph=pw*ti.naturalHeight/ti.naturalWidth,fy=h*.17+(u.air?h*.08:0);c.drawImage(ti,-pw/2,fy-ph*.3,pw,ph)}
        else if(!gone){c.fillStyle='#0005';c.beginPath();c.ellipse(0,h*.22,h*.16,h*.03,0,0,7);c.fill()}
        c.restore();
      }
      // units
      for(const u of[L,R]){
        const p=sidePos(u);let x=p.x,y=p.y,alpha=1;
        if(u===s.att&&melee){const dk=k<.2?0:k<impactK?(k-.2)/(impactK-.2):k<.75?1:1-(k-.75)/.25;x+=(T.x-p.x)*.62*Math.max(0,Math.min(1,dk))}
        if(u===s.def&&!s.hit&&k>impactK-.12&&k<.9){y-=h*.16*Math.sin(Math.min(1,(k-(impactK-.12))/.5)*Math.PI)}
        if(u===s.def&&s.kill&&k>.7){alpha=Math.max(0,1-(k-.7)/.25)}
        if(strikes.some((sj,j)=>j<i&&sj.kill&&sj.def===u))alpha=0;
        if(alpha<=0)continue;
        c.save();c.globalAlpha=alpha;c.translate(x,y+(u.air?Math.sin(now/250)*h*.02:0));
        // 被弾時は点滅させる（ctx.filter はスマホで非常に重いので使わない）
        if(u===s.def&&s.hit&&k>impactK&&k<impactK+.1&&Math.floor(now/40)%2)c.globalAlpha=alpha*.35;
        const big=SPR[u.key].big;
        // 設定画の絵をそのまま描く（反転しない）
        if(ready(big)){const sc=h*(u.boss?.27:.24);c.scale(sc,sc);c.translate(0,-.12);drawSprite(c,big)}
        else{const sc=h*(u.boss?.24:.19);c.scale(p.f*sc,sc);drawMech(c,u,now)}
        c.restore();
      }
      // projectiles
      if(!melee&&k>.25&&k<impactK+.04){
        const pk=clamp((k-.25)/(impactK-.25),0,1),sx=A.x+A.f*h*.15,sy=A.y-h*.08,ex=T.x+(s.hit?0:-T.f*0),ey=T.y-h*.05-(s.hit?0:h*.1);
        const fx=s.w.fx;
        if(fx==='beam'||fx==='blast'){const bw=fx==='blast'?h*.09:h*.03;c.strokeStyle=fx==='blast'?'#ffd36b':'#8ff3ff';c.lineCap='round';c.lineWidth=bw;c.globalAlpha=.85;c.beginPath();c.moveTo(sx,sy);c.lineTo(sx+(ex-sx)*pk,sy+(ey-sy)*pk);c.stroke();c.strokeStyle='#fff';c.lineWidth=bw*.35;c.stroke();c.globalAlpha=1}
        else if(fx==='bullet'){for(let n=0;n<5;n++){const q=clamp(pk-n*.08,0,1);if(q<=0)continue;circ(c,sx+(ex-sx)*q,sy+(ey-sy)*q+Math.sin(n*9)*h*.01,h*.012,'#ffe680')}}
        else if(fx==='missile'||fx==='shell'){for(let n=0;n<(fx==='missile'?3:1);n++){const q=clamp(pk-n*.1,0,1);const arc=Math.sin(q*Math.PI)*h*(fx==='shell'?.3:.12)*(n%2?1:-1);const mx=sx+(ex-sx)*q,my=sy+(ey-sy)*q-Math.abs(arc);c.fillStyle='#ddd';c.fillRect(mx-h*.02,my-h*.008,h*.04,h*.016);circ(c,mx-A.f*h*.03,my,h*.012,'#ff9a3d')}}
        else{circ(c,sx+(ex-sx)*pk,sy+(ey-sy)*pk,h*.02,'#fff')}
      }
      if(melee&&k>impactK-.02&&k<impactK+.12&&s.hit){c.strokeStyle='#fff';c.lineWidth=h*.015;c.beginPath();c.moveTo(T.x-h*.18,T.y-h*.25);c.lineTo(T.x+h*.18,T.y+h*.1);c.stroke()}
      // explosion
      if(s.kill&&k>.65){const ek=(k-.65)/.35;for(let n=0;n<3;n++){c.globalAlpha=Math.max(0,1-ek);circ(c,T.x+Math.sin(n*2.1)*h*.06,T.y-h*.05+Math.cos(n*1.7)*h*.05,h*(.08+ek*.3)*(1-n*.2),['#fff3c4','#ffb347','#ff5a3d'][n])}c.globalAlpha=1;if(!s._boom){s._boom=1;snd('boom')}}
      // particles
      for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=h*.0009;p.life-=.03;if(p.life>0){c.globalAlpha=p.life;c.fillStyle=p.c;c.fillRect(p.x,p.y,h*.012,h*.012)}}c.globalAlpha=1;parts=parts.filter(p=>p.life>0);
      c.restore();
      if(flash>0){c.fillStyle=`rgba(255,255,255,${flash*.5})`;c.fillRect(0,0,w,h);flash*=.82}
      // damage text
      if(k>impactK&&k<1){const tk=(k-impactK)/(1-impactK);c.font=`${h*(s.crit?.12:.1)}px DotGothic16,monospace`;c.textAlign='center';c.lineWidth=h*.012;c.strokeStyle='#000';const tx=T.x,ty=T.y-h*.32-tk*h*.05;const txt=s.hit?String(s.dmg):'MISS';c.strokeText(txt,tx,ty);c.fillStyle=s.hit?(s.crit?'#ffc23d':'#fff'):'#9fc3ff';c.fillText(txt,tx,ty);if(s.crit){c.font=`${h*.05}px DotGothic16,monospace`;c.strokeText('CRITICAL!',tx,ty-h*.1);c.fillText('CRITICAL!',tx,ty-h*.1)}}
      // HUD
      const bar=(u,x,al)=>{const bw=w*.4,bh=h*.035,bx=al==='l'?x:x-bw,v=disp[u.id];c.fillStyle='#000a';c.fillRect(bx-4,h*.03-4,bw+8,h*.12);c.font=`${h*.045}px DotGothic16,monospace`;c.textAlign=al==='l'?'left':'right';c.fillStyle=u.team==='ally'?'#45aaff':'#ff5163';c.fillText(u.name,al==='l'?bx:bx+bw,h*.07);c.fillStyle='#e6edf7';c.textAlign=al==='l'?'right':'left';c.fillText(`${v}/${u.maxHp}`,al==='l'?bx+bw:bx,h*.07);c.fillStyle='#222';c.fillRect(bx,h*.09,bw,bh);const f=v/u.maxHp;c.fillStyle=f>.5?'#5fe08a':f>.25?'#ffc23d':'#ff5163';c.fillRect(al==='l'?bx:bx+bw*(1-f),h*.09,bw*f,bh)};
      bar(L,w*.04,'l');bar(R,w*.96,'r');
      if(k<.45){c.globalAlpha=Math.min(1,k*6);c.font=`${h*.06}px DotGothic16,monospace`;c.textAlign='center';const wy=h*.9;c.fillStyle='#000b';const tw=c.measureText(s.w.name).width;c.fillRect(A.x-tw/2-h*.03,wy-h*.065,tw+h*.06,h*.09);c.fillStyle=s.att.team==='ally'?'#8fd0ff':'#ff9aa5';c.fillText(s.w.name,A.x,wy);c.globalAlpha=1}
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ================= TURN FLOW ================= */
async function endPlayerPhase(){
  if(busy||over)return;
  busy=true;sel=null;reach=null;info=null;mode='busy';closeSheet();phase='enemy';renderConsole();
  bgm('enemy');
  await banner('ENEMY PHASE','TURN '+turn,'#ff5163');
  startOfPhase('foe');
  for(const e of alive('foe')){
    if(over)break;if(e.dead)continue;
    await enemyAct(e);
  }
  if(over){busy=false;return}
  checkBonus();
  for(const e of alive('foe'))e.acted=false;
  turn++;phase='player';
  for(const u of alive('ally')){u.acted=false;u.moved=false;u.buf={...(u.buf.dodge?{dodge:1}:{}),...(u.buf.dbl?{dbl:1}:{})}}
  sel=null;renderConsole();
  bgm('player');
  await banner('PLAYER PHASE','TURN '+turn,'#45aaff');
  startOfPhase('ally');
  mode='idle';busy=false;renderConsole();
  autoSave();
}
function startOfPhase(team){
  for(const u of alive(team)){
    if(!u.air&&terOf(u.x,u.y).heal){const hh=Math.round(u.maxHp*.1),ee=Math.round(u.maxEn*.1);u.hp=Math.min(u.maxHp,u.hp+hh);u.en=Math.min(u.maxEn,u.en+ee);floats.push({x:u.x,y:u.y,text:'+'+hh,color:'#5fe08a',t0:performance.now()})}
    if(team==='ally')u.sp=Math.min(u.maxSp,u.sp+5);
    u.en=Math.min(u.maxEn,u.en+5);
  }
}
async function enemyAct(e){
  const guard=e.guard&&turn<3&&!alive('ally').some(p=>dist(p,e)<=6);
  if(e.guard&&!guard)e.guard=false;
  const r=computeReach(e,guard);
  let best=null;
  for(const t of r.tiles){
    const ox=e.x,oy=e.y;e.x=t.x;e.y=t.y;
    for(const p of alive('ally')){const d=Math.abs(t.x-p.x)+Math.abs(t.y-p.y);
      for(const w of e.weapons){if(usable(e,w)||!inRange(w,d))continue;
        const hr=hitRate(e,p,w),dm=baseDmg(e,p,w);let sc=dm*hr/100;if(dm>=p.hp)sc+=2500*hr/100;if(p.key===ST.leader)sc*=1.1;
        const cw=bestWeapon(p,e,d);if(cw)sc-=baseDmg(p,e,cw)*hitRate(p,e,cw)/100*.3;
        sc+=terOf(t.x,t.y).e*3;
        if(!best||sc>best.sc)best={sc,t,p,w}}}
    e.x=ox;e.y=oy;
  }
  sel=e;renderConsole();await sleep(280);
  if(best){
    await animateMove(e,r.path(best.t.x,best.t.y));await sleep(150);
    let choice={mode:'counter'};
    if(settings.manualDef)choice={mode:await defenseChoice(e,best.p,best.w)};
    await combat(e,best.p,best.w,choice);
  }else if(!guard){
    let tgt=null,td=1e9;for(const p of alive('ally')){const d=dist(p,e);if(d<td){td=d;tgt=p}}
    if(tgt){let bt=null,bd=1e9;for(const t of r.tiles){const d=Math.abs(t.x-tgt.x)+Math.abs(t.y-tgt.y)-terOf(t.x,t.y).e*.02;if(d<bd){bd=d;bt=t}}
      if(bt)await animateMove(e,r.path(bt.x,bt.y))}
  }
  e.acted=true;sel=null;renderConsole();await sleep(120);
}
function defenseChoice(a,d,w){
  return new Promise(res=>{
    const f=forecastHtml(a,d,w,'counter');
    const cw=bestWeapon(d,a,dist(a,d));
    openSheet(`<div class="sh-title"><span>敵の攻撃！　${d.name}の対応</span></div>${f.html}
    <div class="hint" style="margin-top:8px">防御：被ダメージ半減／回避：敵の命中率半減（どちらも反撃なし）</div>
    <div class="sh-actions"><button class="btn pri" data-def="counter" ${cw?'':'disabled'}>反撃</button><button class="btn" data-def="defend">防御</button><button class="btn" data-def="evade">回避（${hitRate(a,d,w,'evade')}%）</button></div>`);
    sheet._def=res;
  });
}

/* ================= SAVE / LOAD ================= */
// localStorage の granvald-save-1〜3（手動）と granvald-save-auto（味方フェイズ開始時に自動）。
// 形式が変わったら SAVE_VER を上げる（2：ステージとイベントのフラグを追加）。バージョンが違うデータは壊れたデータとして扱う
const SAVE_VER=2,SAVE_KEY='granvald-save-',SLOTS=['auto','1','2','3'];
const SLOT_NAME=id=>id==='auto'?'オートセーブ':'スロット'+id;
const BUF_KEYS=Object.values(SPIRITS).map(s=>s.key).filter(Boolean);
// 読み書きは必ず try/catch で（プライベートブラウズなどで localStorage が使えなくても止まらないように）
function storeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function storeSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function storeDel(k){try{localStorage.removeItem(k)}catch(e){}}
function snapshot(){
  return{ver:SAVE_VER,stage:ST.id,savedAt:Date.now(),turn,phase,flags:{...flags},
    units:units.map(u=>({key:u.key,team:u.team,x:u.x,y:u.y,dir:u.dir,hp:u.hp,en:u.en,will:u.will,sp:u.sp,
      ammo:u.weapons.map(w=>w.ammo),acted:u.acted,moved:u.moved,dead:u.dead,buf:{...u.buf},guard:!!u.guard}))};
}
// 中身を1項目ずつ確かめる。どこかおかしければ壊れたデータ
function validSave(d){
  const int=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b,bool=v=>typeof v==='boolean';
  if(!d||typeof d!=='object'||d.ver!==SAVE_VER||!Object.hasOwn(STAGES,d.stage)||!int(d.turn,1,999)||d.phase!=='player'||!Number.isFinite(d.savedAt))return false;
  const st=STAGES[d.stage],ROSTER=st.roster,FLAGS=[...(st.talks||[]).map(t=>t.id),'bonus'];
  if(!d.flags||typeof d.flags!=='object'||Array.isArray(d.flags)||!Object.entries(d.flags).every(([k,v])=>FLAGS.includes(k)&&bool(v)))return false;
  if(!Array.isArray(d.units)||d.units.length!==ROSTER.length)return false;
  return d.units.every((s,i)=>{
    const[key,team]=ROSTER[i],t=TPL[key];
    return s&&s.key===key&&s.team===team&&int(s.x,0,COLS-1)&&int(s.y,0,ROWS-1)&&['up','down','left','right'].includes(s.dir)&&
      int(s.hp,0,t.hp)&&int(s.en,0,t.en)&&int(s.will,0,150)&&int(s.sp,0,t.pilot.sp)&&bool(s.acted)&&bool(s.moved)&&bool(s.dead)&&bool(s.guard)&&
      Array.isArray(s.ammo)&&s.ammo.length===t.weapons.length&&s.ammo.every((a,j)=>int(a,0,t.weapons[j].ammo||0))&&
      s.buf&&typeof s.buf==='object'&&!Array.isArray(s.buf)&&Object.entries(s.buf).every(([k,v])=>BUF_KEYS.includes(k)&&v===1)&&(s.dead||s.hp>0);
  });
}
// null＝データなし、{broken:true}＝壊れている、それ以外＝読み込めるデータ
function readSlot(id){
  const raw=storeGet(SAVE_KEY+id);if(raw==null)return null;
  try{const d=JSON.parse(raw);return validSave(d)?d:{broken:true}}catch(e){return{broken:true}}
}
const hasSave=()=>SLOTS.some(id=>{const d=readSlot(id);return d&&!d.broken});
function refreshContinue(){$('btnContinue').disabled=!hasSave()}
function writeSlot(id){const ok=storeSet(SAVE_KEY+id,JSON.stringify(snapshot()));refreshContinue();return ok}
const canSave=()=>phase==='player'&&!busy&&!over&&(mode==='idle'||mode==='peek')&&!sel;
function autoSave(){if(canSave())writeSlot('auto')}
function restore(d){
  loadStage(d.stage);setup();
  units.forEach((u,i)=>{const s=d.units[i];
    Object.assign(u,{x:s.x,y:s.y,dir:s.dir,hp:s.hp,en:s.en,will:s.will,sp:s.sp,acted:s.acted,moved:s.moved,dead:s.dead,buf:{...s.buf}});
    if(s.guard)u.guard=true;else delete u.guard;
    u.weapons.forEach((w,j)=>w.ammo=s.ammo[j]);
  });
  turn=d.turn;phase=d.phase;flags={...d.flags};
  sel=null;reach=null;info=null;targets=null;mode='idle';busy=false;over=false;
}
function fmtDate(t){const d=new Date(t),z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`}
function slotRow(id,act){
  const d=readSlot(id);let body,ok=true;
  if(!d){body=`<span class="n">${SLOT_NAME(id)}</span><span class="p"></span><span class="d">データなし</span>`;ok=act==='save'}
  else if(d.broken){body=`<span class="n">${SLOT_NAME(id)}</span><span class="p"></span><span class="d"><span class="ng">壊れたデータ（読み込めません）</span></span>`;ok=act==='save'}
  else{const al=d.units.filter(u=>u.team==='ally'),left=al.filter(u=>!u.dead).length;
    body=`<span class="n">${SLOT_NAME(id)}　${stageTitle(STAGES[d.stage])}</span><span class="p">TURN ${d.turn}</span><span class="d">${fmtDate(d.savedAt)}　味方 残り ${left}/${al.length} 機</span>`}
  const del=d?`<button class="btn del" data-slot="${id}" data-act="del">削除</button>`:'';
  return`<div class="slot"><button class="wrow" data-slot="${id}" data-act="${act}" ${ok?'':'disabled'}>${body}</button>${del}</div>`;
}
// ページ内の確認（confirm() は使わない）
function confirmSheet(msg,yesLabel,onYes,onNo){
  openSheet(`<div class="sh-title"><span>確認</span></div><div class="confirm">${msg}</div><div class="sh-actions"><button class="btn warn" data-x="yes">${yesLabel}</button><button class="btn" data-x="no">やめる</button></div>`);
  sheet._yes=onYes;sheet._no=onNo;
}
function deleteFlow(id,back){
  confirmSheet(`${SLOT_NAME(id)}のデータを削除しますか？<br><small style="color:var(--mute)">削除したデータは元に戻せません。</small>`,'削除する',()=>{storeDel(SAVE_KEY+id);refreshContinue();snd('cancel');toast(`${SLOT_NAME(id)}を削除しました`);back()},back);
}
function saveSheet(){
  if(!canSave()){toast('今はセーブできません');return}
  openSheet(`<div class="sh-title"><span>セーブ</span><span style="color:var(--mute);font-size:12px">TURN ${turn}</span></div><div class="slots">${['1','2','3'].map(id=>slotRow(id,'save')).join('')}</div>
  <div class="hint" style="margin-top:8px">オートセーブは味方フェイズの開始時に自動で上書きされます</div><div class="sh-actions"><button class="btn" data-x="close">閉じる</button></div>`);
  sheet._slot=(id,act)=>{
    if(act==='del')return deleteFlow(id,saveSheet);
    const doSave=()=>{if(writeSlot(id)){snd('ok');toast(`${SLOT_NAME(id)}にセーブしました`);closeSheet()}else{snd('cancel');toast('セーブできませんでした（ブラウザの保存領域が使えません）');saveSheet()}};
    if(readSlot(id))confirmSheet(`${SLOT_NAME(id)}に上書きしますか？<br><small style="color:var(--mute)">前のデータは消えます。</small>`,'上書きする',doSave,saveSheet);
    else doSave();
  };
}
function loadSheet(){
  const inGame=$('title').hidden&&!$('result');
  openSheet(`<div class="sh-title"><span>ロード</span></div><div class="slots">${SLOTS.map(id=>slotRow(id,'load')).join('')}</div>
  <div class="sh-actions"><button class="btn" data-x="close">閉じる</button></div>`);
  sheet._slot=(id,act)=>{
    if(act==='del')return deleteFlow(id,loadSheet);
    const d=readSlot(id);if(!d||d.broken){toast('このデータは読み込めません');loadSheet();return}
    const doLoad=()=>{closeSheet();restore(d);$('title').hidden=true;$('result')?.remove();resize();buildTerrain();renderConsole();
      bgm('player');snd('ok');toast(`${SLOT_NAME(id)}をロードしました（TURN ${d.turn}）`)};
    // 遊んでいる途中なら、今の進行が消えることを確かめてから
    if(inGame)confirmSheet(`${SLOT_NAME(id)}（TURN ${d.turn}）をロードしますか？<br><small style="color:var(--mute)">セーブしていない今の進行は失われます。</small>`,'ロードする',doLoad,loadSheet);
    else doLoad();
  };
}

/* ================= TITLE / START ================= */
function titleArt(){
  const c=$('tcv'),dpr=Math.min(2,window.devicePixelRatio||1),W_=c.clientWidth||400;c.width=W_*dpr;c.height=W_*.5*dpr;const x=c.getContext('2d'),w=c.width,h=c.height;
  const demo=k=>({kind:TPL[k].kind,col:TPL[k].col});
  function f(now){if($('title').hidden)return;x.clearRect(0,0,w,h);
    const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0a1019');g.addColorStop(1,'#1a2a44');x.fillStyle=g;x.fillRect(0,0,w,h);
    x.strokeStyle='#45aaff22';x.lineWidth=dpr;for(let i=0;i<12;i++){x.beginPath();x.moveTo(0,h*.8+i*i*dpr);x.lineTo(w,h*.8+i*i*dpr);x.stroke()}
    const draw=(k,px,py,s,fl)=>{x.save();x.translate(px,py+Math.sin(now/600+px)*h*.015);const b=SPR[k].big;if(ready(b)){x.scale(s,s);drawSprite(x,b)}else{x.scale(s*fl,s);drawMech(x,demo(k),now)}x.restore()};
    draw('sylph',w*.24,h*.56,h*.26,1);draw('raven',w*.8,h*.3,h*.16,-1);draw('bulwark',w*.74,h*.66,h*.2,-1);draw('grand',w*.5,h*.5,h*.4,1);
    requestAnimationFrame(f)}
  requestAnimationFrame(f);
}
// ステージを始める：戦闘前の会話（マップを隠す）→ マップに入って開始時の会話 → 味方フェイズ
async function startGame(id){
  loadStage(id);setup();resize();mode='busy';busy=true;renderConsole();
  for(const a of Object.values(BGM))a.currentTime=0;
  bgm('player');
  if(ST.pre)await dialog(ST.pre,{solid:true});
  await dialog(ST.start);
  await banner('PLAYER PHASE','TURN 1','#45aaff');
  mode='idle';busy=false;renderConsole();
  autoSave();
}
function renderStageList(){
  $('stageList').innerHTML=STAGE_ORDER.map((id,i)=>{const st=STAGES[id];
    return`<button class="btn ${i?'':'pri'}" data-stage="${id}">${st.label}「${st.name}」<small>${id==='e1'?'帝国の辺境。盗賊団から村を救え':'帝国軍の機動部隊から港町を守れ'}</small></button>`}).join('');
}
$('stageList').onclick=e=>{const b=e.target.closest('[data-stage]');if(!b)return;snd('ok');unlockBgm();$('title').hidden=true;startGame(b.dataset.stage)};
// 結果画面からタイトルへ戻る
function toTitle(){bgm(null);closeSheet();loadStage('s1');setup();resize();mode='title';busy=false;renderConsole();refreshContinue();$('title').hidden=false;titleArt()}
$('btnContinue').onclick=()=>{snd('sel');unlockBgm();loadSheet()};
// スマホではアドレスバーの出入りなどで resize が何度も来る。マス目の大きさが変わらないときは作り直さない（resize の中で判定）
window.addEventListener('resize',()=>resize());
loadStage('s1');setup();resize();renderConsole();renderStageList();titleArt();refreshContinue();requestAnimationFrame(loop);
</script>
