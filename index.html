<title>機甲戦線グランヴァルド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen tactics console — status bar / map canvas / unit console, with sheets sliding over the map */
:root{
  color-scheme:dark;
  --bg:#0a1019; --panel:#121b29; --panel2:#192539; --line:#2a3b55;
  --fg:#e6edf7; --mute:#8798b0; --ally:#45aaff; --foe:#ff5163; --amber:#ffc23d; --good:#5fe08a;
  --disp:'DotGothic16','Zen Kaku Gothic New',monospace;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--body);color:var(--fg)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 18px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px}
.turn{font-family:var(--disp);font-size:15px;letter-spacing:.06em}
.phase{font-family:var(--disp);font-size:12px;padding:3px 8px;border-radius:3px;letter-spacing:.12em;background:color-mix(in srgb,var(--ally) 22%,transparent);color:var(--ally);border:1px solid color-mix(in srgb,var(--ally) 50%,transparent)}
.phase.enemy{background:color-mix(in srgb,var(--foe) 22%,transparent);color:var(--foe);border-color:color-mix(in srgb,var(--foe) 50%,transparent)}
.sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--mute)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ally);border-color:var(--ally);color:#06121f}
.btn.warn{background:var(--foe);border-color:var(--foe);color:#1a0508}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
#mapwrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000;line-height:0}
#map{display:block;width:100%;touch-action:manipulation}
#console{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:132px}
.uhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.uname{font-family:var(--disp);font-size:17px}
.upil{color:var(--mute);font-size:13px}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mute)}
.tag.ally{color:var(--ally);border-color:color-mix(in srgb,var(--ally) 50%,transparent)}
.tag.foe{color:var(--foe);border-color:color-mix(in srgb,var(--foe) 50%,transparent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12px}
.meter{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.meter b{font-family:var(--disp);font-weight:400;width:22px;color:var(--mute)}
.meter .track{flex:1;height:6px;background:#00000066;border-radius:2px;overflow:hidden}
.meter .fill{height:100%}
.meter span{min-width:76px;text-align:right;font-family:var(--disp)}
.kv{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.kv em{font-style:normal;color:var(--fg);font-family:var(--disp)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 6px;border-radius:10px;background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.hint{font-size:13px;color:var(--mute);line-height:1.6}
/* sheets */
#sheet{position:fixed;inset:auto 0 0 0;z-index:40;display:flex;justify-content:center;pointer-events:none}
#sheet .in{pointer-events:auto;width:100%;max-width:600px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:72vh;overflow:auto;box-shadow:0 -10px 40px #000a;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh-title{font-family:var(--disp);font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.wlist{display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;width:100%}
.wrow:disabled{opacity:.4;cursor:default}
.wrow .n{font-weight:700;font-size:14px}
.wrow .p{font-family:var(--disp);font-size:16px;text-align:right}
.wrow .d{grid-column:1/-1;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.wrow .d .ng{color:var(--foe)}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc .side{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px}
.fc .side.a{border-top:3px solid var(--ally)}
.fc .side.e{border-top:3px solid var(--foe)}
.fc .nm{font-family:var(--disp);font-size:14px;margin-bottom:4px}
.fc .wp{font-size:12px;color:var(--mute);margin-bottom:6px;min-height:1.3em}
.fc .big{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);align-items:baseline}
.fc .big em{font-style:normal;font-family:var(--disp);font-size:20px;color:var(--fg)}
.fc .big em.hi{color:var(--good)}
.sh-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sh-actions .btn{flex:1}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.toggle small{display:block;color:var(--mute);font-size:12px}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050910ee;padding:16px}
#battle .stage{width:min(100%,680px);position:relative}
#bcv{width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:#000}
.msg{width:min(100%,680px);margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-height:72px}
.msg .who{font-family:var(--disp);font-size:13px;color:var(--amber);margin-bottom:4px}
.msg .txt{font-size:15px;line-height:1.6}
.skip{margin-top:8px;font-size:12px;color:var(--mute)}
#banner{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;pointer-events:none}
#banner .b{font-family:var(--disp);font-size:clamp(28px,8vw,48px);letter-spacing:.18em;padding:14px 0;width:100%;text-align:center;background:linear-gradient(90deg,transparent,#000c 20%,#000c 80%,transparent);animation:ban 1.2s ease-in-out forwards}
#banner .b small{display:block;font-size:13px;letter-spacing:.3em;color:var(--mute)}
@keyframes ban{0%{opacity:0;transform:translateX(-40px)}20%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40px)}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-size:13px;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#title .logo{font-family:var(--disp);font-size:clamp(30px,9vw,54px);letter-spacing:.08em;text-align:center;line-height:1.2;text-wrap:balance}
#title .logo small{display:block;font-size:13px;letter-spacing:.4em;color:var(--amber);margin-bottom:8px}
#title .sub{color:var(--mute);margin:14px 0 22px;text-align:center;font-size:14px;line-height:1.8;max-width:30em}
#title canvas{width:min(100%,420px);aspect-ratio:2/1;margin-bottom:10px}
.dlg{cursor:pointer}
@media (prefers-reduced-motion:reduce){#banner .b,#sheet .in{animation:none}}
</style>

<div id="app">
  <div class="bar">
    <span class="turn" id="turnLbl">TURN 1</span>
    <span class="phase" id="phaseLbl">PLAYER</span>
    <span class="sp"></span>
    <button class="btn sm" id="btnCfg" aria-label="設定">設定</button>
    <button class="btn sm pri" id="btnEnd">ターン終了</button>
  </div>
  <div id="mapwrap"><canvas id="map" aria-label="戦闘マップ"></canvas></div>
  <div id="console"></div>
</div>
<div id="sheet" hidden></div>
<div id="banner" hidden></div>
<div id="toast" style="opacity:0"></div>

<div id="battle" class="ov" hidden>
  <div class="stage"><canvas id="bcv"></canvas></div>
  <div class="msg"><div class="who" id="bWho"></div><div class="txt" id="bTxt"></div></div>
  <div class="skip">タップでスキップ</div>
</div>

<div id="dialog" class="ov dlg" hidden>
  <div class="msg" style="max-width:600px"><div class="who" id="dWho"></div><div class="txt" id="dTxt"></div></div>
  <div class="skip">タップで次へ</div>
</div>

<div id="title" class="ov">
  <canvas id="tcv"></canvas>
  <div class="logo"><small>STAGE 01 · 鋼の目覚め</small>機甲戦線<br>グランヴァルド</div>
  <div class="sub">帝国軍の機動兵器部隊が港湾都市に迫る。<br>4機の小隊で迎え撃ち、司令機ネメシスを撃破せよ。</div>
  <button class="btn pri" id="btnStart" style="min-width:180px;font-size:16px">出撃</button>
</div>

<script>
'use strict';
/* ================= DATA ================= */
const COLS=10, ROWS=12;
const MAP=[
 "MMFFPBPFMM",
 "MFPPPPPPFM",
 "FPPCCPPPPF",
 "PPPCCPPFFP",
 "PFPPPPWWPP",
 "PFFPPWWWPP",
 "PPPPWWWPFP",
 "PPFPPWPPFF",
 "MPPPPPPCCP",
 "MFPPFPPCCP",
 "MMPPPPPPFM",
 "MMFPBPPFMM"];
const TER={
 P:{n:'平地',c:1,d:0,e:0},
 F:{n:'森',c:2,d:.10,e:10},
 M:{n:'山',c:3,d:.20,e:15},
 W:{n:'海',c:2,d:0,e:-10},
 C:{n:'市街',c:1,d:.15,e:5},
 B:{n:'基地',c:1,d:.20,e:15,heal:true}
};
function W(name,type,pow,min,max,o={}){return{name,type,pow,min,max,en:o.en||0,maxAmmo:o.ammo||0,ammo:o.ammo||0,will:o.will||0,hit:o.hit||0,fx:o.fx||(type==='格'?'slash':'beam')}}
const SPIRITS={
 '必中':{cost:15,desc:'このターン、攻撃が必ず命中する',key:'hit100'},
 'ひらめき':{cost:10,desc:'次の敵の攻撃を1回だけ必ず回避',key:'dodge'},
 '集中':{cost:15,desc:'このターン、命中率と回避率が+30%',key:'focus'},
 '熱血':{cost:30,desc:'次に命中した攻撃のダメージが2倍',key:'dbl'},
 '鉄壁':{cost:20,desc:'このターン、受けるダメージが1/4',key:'wall'},
 '加速':{cost:5,desc:'このターンの移動力+3（移動前のみ）',key:'accel'},
 '根性':{cost:20,desc:'HPを最大値の30%回復',key:null},
 '気合':{cost:20,desc:'気力+10',key:null}
};
const TPL={
 grand:{name:'グランヴァルド',kind:'super',hp:5200,en:180,armor:1400,mob:75,move:4,
  col:{main:'#1f6b66',sub:'#3a3f4a',acc:'#e0a63a',eye:'#9dfcd2'},
  pilot:{name:'鷹野 迅',melee:160,shoot:130,hit:140,eva:120,skill:130,sp:60,spirits:['必中','熱血','鉄壁','気合']},
  lines:['いくぜ、グランヴァルド！','こいつで決める！','まだまだァ！','鉄の拳を食らえ！'],
  weapons:[W('ナックルブレイカー','格',1700,1,1,{hit:10,fx:'punch'}),W('アイビーム','射',1500,1,3,{en:10,fx:'beam'}),W('ヴァルドブレード','格',2900,1,1,{en:30,will:110,hit:5}),W('ギガ・バスター','射',3800,1,2,{en:60,will:130,hit:-5,fx:'blast'})]},
 sylph:{name:'シルフィード',kind:'real',hp:3000,en:150,armor:900,mob:120,move:6,
  col:{main:'#e8ecf2',sub:'#2fb3a5',acc:'#ff6a6a',eye:'#9dff9a'},
  pilot:{name:'天城 ミオ',melee:140,shoot:165,hit:170,eva:180,skill:160,sp:55,spirits:['ひらめき','集中','加速','必中']},
  lines:['ターゲット、ロック！','遅いよ！','この距離なら外さない。'],
  weapons:[W('ビームダガー','格',1300,1,1,{hit:15}),W('レールライフル','射',1600,1,4,{ammo:8,fx:'bullet'}),W('ホーミングミサイル','射',1800,2,5,{ammo:4,hit:10,fx:'missile'}),W('ハイパーランチャー','射',2800,2,6,{en:50,will:115,fx:'blast'})]},
 bulwark:{name:'ブルワーク',kind:'tank',hp:4200,en:160,armor:1300,mob:60,move:3,repair:true,
  col:{main:'#6f7d4c',sub:'#c9b98a',acc:'#ffc23d',eye:'#ffd27a'},
  pilot:{name:'岩瀬 ゴウ',melee:110,shoot:150,hit:145,eva:100,skill:120,sp:50,spirits:['根性','鉄壁','必中','気合']},
  lines:['砲撃支援、行くぞ。','狙いは十分だ。','下がってろ、ここは俺が受ける。'],
  weapons:[W('マシンキャノン','射',1200,1,2,{hit:10,fx:'bullet'}),W('ロングカノン','射',2100,3,6,{ammo:6,fx:'shell'})]},
 raven:{name:'レイヴンウィング',kind:'jet',hp:2800,en:140,armor:800,mob:115,move:7,air:true,
  col:{main:'#2b3140',sub:'#4fa3ff',acc:'#ffd34d',eye:'#bff'},
  pilot:{name:'風間 リク',melee:145,shoot:150,hit:155,eva:165,skill:150,sp:50,spirits:['加速','ひらめき','熱血','集中']},
  lines:['空はオレの庭だ！','一気に抜ける！','振り切ってやるぜ。'],
  weapons:[W('バルカン','射',900,1,2,{hit:15,fx:'bullet'}),W('スピアミサイル','射',1700,1,4,{ammo:6,fx:'missile'}),W('ソニックダイブ','格',2300,1,1,{en:30,will:110,fx:'dive'})]},
 zekt:{name:'ゼクト',kind:'drone',hp:2200,en:100,armor:800,mob:80,move:5,
  col:{main:'#6b2a3a',sub:'#a7a7b8',acc:'#ff5163',eye:'#ff5163'},
  pilot:{name:'帝国兵',melee:120,shoot:120,hit:120,eva:110,skill:100,sp:0,spirits:[]},
  lines:['排除する。','標的確認。'],
  weapons:[W('クロー','格',1300,1,1,{}),W('ビーム砲','射',1400,1,3,{fx:'beam'})]},
 golm:{name:'ゴルム',kind:'heavy',hp:4000,en:100,armor:1200,mob:55,move:3,
  col:{main:'#4a3a5c',sub:'#9c8fb0',acc:'#ff8a3d',eye:'#ff8a3d'},
  pilot:{name:'帝国重装兵',melee:135,shoot:125,hit:125,eva:95,skill:105,sp:0,spirits:[]},
  lines:['押し潰せ！','重装甲を甘く見るな。'],
  weapons:[W('アイアンハンマー','格',1900,1,1,{fx:'punch'}),W('拡散砲','射',1600,2,4,{fx:'shell'})]},
 vespa:{name:'ヴェスパ',kind:'wasp',hp:2000,en:100,armor:700,mob:100,move:6,air:true,
  col:{main:'#8a6420',sub:'#d8c27a',acc:'#ff5163',eye:'#ff5163'},
  pilot:{name:'帝国飛行兵',melee:120,shoot:125,hit:130,eva:130,skill:105,sp:0,spirits:[]},
  lines:['上空から仕留める。'],
  weapons:[W('ニードルショット','射',1300,1,3,{fx:'bullet'})]},
 nemesis:{name:'カイザー・ネメシス',kind:'boss',hp:12000,en:250,armor:1500,mob:90,move:4,boss:true,
  col:{main:'#221630',sub:'#7b2d8e',acc:'#ff3355',eye:'#ff3355'},
  pilot:{name:'総帥ザルグ',melee:175,shoot:170,hit:170,eva:140,skill:160,sp:0,spirits:[]},
  lines:['ひれ伏すがいい！','この程度か、旧式ども。','帝国に逆らった報いを受けよ！'],
  weapons:[W('ネメシスソード','格',2600,1,1,{hit:10}),W('ダークレイ','射',2400,1,4,{fx:'beam'}),W('終焉砲','射',3600,2,5,{en:50,will:120,fx:'blast'})]}
};
/* ================= STATE ================= */
let units=[],turn=1,phase='player',mode='title',sel=null,reach=null,origin=null,curW=null,targets=null,info=null,floats=[],mapFx=[],busy=false,bossTalked=false,uid=0,over=false;
const settings={anim:true,manualDef:false,sound:true};
try{Object.assign(settings,JSON.parse(localStorage.getItem('gv-settings')||'{}'))}catch(e){}
function saveSettings(){try{localStorage.setItem('gv-settings',JSON.stringify(settings))}catch(e){}}

function mk(key,team,x,y,extra={}){
  const t=TPL[key];
  const u={id:++uid,key,team,x,y,name:t.name,kind:t.kind,col:t.col,maxHp:t.hp,hp:t.hp,maxEn:t.en,en:t.en,armor:t.armor,mob:t.mob,move:t.move,air:!!t.air,repair:!!t.repair,boss:!!t.boss,
    pilot:{...t.pilot},lines:t.lines,weapons:t.weapons.map(w=>({...w})),will:100,acted:false,moved:false,dead:false,buf:{},sp:t.pilot.sp,maxSp:t.pilot.sp,...extra};
  units.push(u);return u;
}
function setup(){
  units=[];uid=0;turn=1;phase='player';sel=null;reach=null;info=null;floats=[];mapFx=[];bossTalked=false;over=false;
  mk('grand','ally',4,10);mk('sylph','ally',6,10);mk('bulwark','ally',4,11);mk('raven','ally',3,10);
  mk('zekt','foe',2,4);mk('zekt','foe',7,3);mk('zekt','foe',4,5);mk('vespa','foe',8,5);mk('vespa','foe',1,2);
  mk('golm','foe',3,2);mk('golm','foe',6,1);
  mk('nemesis','foe',5,0,{will:110,guard:true});
}
const alive=t=>units.filter(u=>!u.dead&&(!t||u.team===t));
const unitAt=(x,y)=>units.find(u=>!u.dead&&u.x===x&&u.y===y);
const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const terOf=(x,y)=>TER[MAP[y][x]];
function tmod(u){if(u.air)return{d:0,e:0};const t=terOf(u.x,u.y);return{d:t.d,e:t.e}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= RULES ================= */
function usable(u,w){
  if(w.en>u.en)return'EN不足';
  if(w.maxAmmo&&w.ammo<=0)return'弾切れ';
  if(u.will<w.will)return'気力'+w.will+'必要';
  return null;
}
function hitRate(a,d,w,mode){
  if(a.buf.hit100)return 100;
  if(d.buf.dodge)return 0;
  let h=80+(a.pilot.hit-d.pilot.eva)*.5-(d.mob-70)*.4+w.hit-tmod(d).e+(a.will-d.will)*.1;
  if(a.buf.focus)h+=30; if(d.buf.focus)h-=30;
  h=clamp(Math.round(h),0,100);
  if(mode==='evade')h=Math.floor(h/2);
  return h;
}
function baseDmg(a,d,w,mode){
  const st=w.type==='格'?a.pilot.melee:a.pilot.shoot;
  let v=w.pow*(st+a.will)/200-d.armor*.5*d.will/100;
  v*=1-tmod(d).d;
  if(a.buf.dbl)v*=2;
  if(d.buf.wall)v*=.25;
  if(mode==='defend')v*=.5;
  return Math.max(10,Math.round(v));
}
const critRate=(a,d)=>clamp(Math.round((a.pilot.skill-d.pilot.skill)/2+5),0,40);
function inRange(w,d){return d>=w.min&&d<=w.max}
function bestWeapon(a,d,distance){
  let best=null,bs=-1;
  for(const w of a.weapons){if(usable(a,w)||!inRange(w,distance))continue;
    const s=baseDmg(a,d,w)*hitRate(a,d,w)/100+1;if(s>bs){bs=s;best=w}}
  return best;
}
function strike(a,d,w,mode){
  w.en&&(a.en-=w.en); w.maxAmmo&&w.ammo--;
  const hr=hitRate(a,d,w,mode);
  const usedDodge=!!d.buf.dodge&&!a.buf.hit100;
  const hit=Math.random()*100<hr;
  if(usedDodge)delete d.buf.dodge;
  const rec={att:a,def:d,w,hit,dmg:0,crit:false,hpFrom:d.hp,hpTo:d.hp,kill:false,line:a.lines[Math.floor(Math.random()*a.lines.length)]};
  if(hit){
    let dmg=baseDmg(a,d,w,mode)*(0.9+Math.random()*.2);
    if(Math.random()*100<critRate(a,d)){dmg*=1.25;rec.crit=true}
    dmg=Math.max(10,Math.round(dmg));

}

/* ================= MOVEMENT ================= */
function computeReach(u,stay){
  const mv=stay?0:u.move+(u.buf.accel?3:0);
  const key=(x,y)=>y*COLS+x,dist=new Map(),prev=new Map();
  dist.set(key(u.x,u.y),0);const q=[[u.x,u.y,0]];
  while(q.length){
    q.sort((a,b)=>a[2]-b[2]);const[x,y,d]=q.shift();
    if(d>dist.get(key(x,y)))continue;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      const o=unitAt(nx,ny);if(o&&o.team!==u.team)continue;
      const nd=d+(u.air?1:terOf(nx,ny).c);if(nd>mv)continue;
      const k=key(nx,ny);if(!dist.has(k)||nd<dist.get(k)){dist.set(k,nd);prev.set(k,key(x,y));q.push([nx,ny,nd])}
    }
  }
  const tiles=[];
  for(const k of dist.keys()){const x=k%COLS,y=(k/COLS)|0;const o=unitAt(x,y);if(!o||o===u)tiles.push({x,y})}
  return{tiles,has:(x,y)=>tiles.some(t=>t.x===x&&t.y===y),path(x,y){const p=[];let k=key(x,y);while(k!==undefined){p.unshift({x:k%COLS,y:(k/COLS)|0});k=prev.get(k)}return p}};
}
function animateMove(u,path){
  return new Promise(res=>{
    if(path.length<2){res();return}
    let i=0,t0=performance.now();const seg=75;
    snd('move');
    function step(now){
      const f=(now-t0)/seg;
      if(f>=1){i++;t0=now;if(i>=path.length-1){u.px=u.py=undefined;u.x=path[path.length-1].x;u.y=path[path.length-1].y;res();return}}
      const a=path[i],b=path[Math.min(i+1,path.length-1)],k=Math.min(1,(now-t0)/seg);
      u.px=a.x+(b.x-a.x)*k;u.py=a.y+(b.y-a.y)*k;requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

  const w=cv.parentElement.clientWidth;DPR=Math.min(2,window.devicePixelRatio||1);

function rng(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function buildTerrain(){
  const L=document.createElement('canvas');L.width=cv.width;L.height=cv.height;const c=L.getContext('2d');const s=TS*DPR;

    if(t==='F'){for(let i=0;i<4;i++){const px=X+s*(.22+(i%2)*.5)+r()*s*.06,py=Y+s*(.28+(i>>1)*.44);c.fillStyle='#1d4526';c.beginPath();c.arc(px,py+s*.04,s*.17,0,7);c.fill();c.fillStyle='#3f8048';c.beginPath();c.arc(px,py,s*.15,0,7);c.fill()}}
    if(t==='M'){c.fillStyle='#5b4c3a';c.beginPath();c.moveTo(X+s*.08,Y+s*.85);c.lineTo(X+s*.42,Y+s*.18);c.lineTo(X+s*.76,Y+s*.85);c.fill();c.fillStyle='#93826a';c.beginPath();c.moveTo(X+s*.4,Y+s*.85);c.lineTo(X+s*.66,Y+s*.36);c.lineTo(X+s*.94,Y+s*.85);c.fill();c.fillStyle='#d9d3c7';c.beginPath();c.moveTo(X+s*.42,Y+s*.18);c.lineTo(X+s*.5,Y+s*.34);c.lineTo(X+s*.34,Y+s*.34);c.fill()}
    if(t==='W'){c.strokeStyle='#4f8fd0';c.lineWidth=s*.04;for(let i=0;i<3;i++){const py=Y+s*(.25+i*.27);c.beginPath();c.moveTo(X+s*.15,py);c.quadraticCurveTo(X+s*.3,py-s*.08,X+s*.45,py);c.quadraticCurveTo(X+s*.6,py+s*.08,X+s*.75,py);c.stroke()}}

    if(t==='B'){c.strokeStyle='#ffc23d';c.lineWidth=s*.05;c.strokeRect(X+s*.14,Y+s*.14,s*.72,s*.72);c.fillStyle='#ffc23d';c.font=`${s*.42}px DotGothic16, monospace`;c.textAlign='center';c.textBaseline='middle';c.fillText('H',X+s/2,Y+s/2+s*.02)}

function drawUnit(c,u,s,now){

function drawMap(now){

    ctx.beginPath();for(const[cx,cy,dx,dy]of[[X,Y,1,1],[X+s,Y,-1,1],[X,Y+s,1,-1],[X+s,Y+s,-1,-1]]){ctx.moveTo(cx+dx*L,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+dy*L)}ctx.stroke()}

  mapFx=mapFx.filter(f=>now-f.t0<700);
  for(const f of floats){const k=(now-f.t0)/1100;ctx.globalAlpha=Math.max(0,1-k*k);ctx.font=`${s*.4}px DotGothic16,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#000';const X=(f.x+.5)*s,Y=(f.y+.3)*s-k*s*.5;ctx.strokeText(f.text,X,Y);ctx.fillStyle=f.color;ctx.fillText(f.text,X,Y);ctx.globalAlpha=1}
  floats=floats.filter(f=>now-f.t0<1100);
}

async function onTile(x,y){
  const u=unitAt(x,y);
  if(mode==='idle'||mode==='peek'){
    if(u&&u.team==='ally'&&!u.acted){selectUnit(u);return}
    if(u){snd('sel');info={u};sel=null;
      if(u.team==='foe'){reach=computeReach(u,u.guard&&turn<3);const at=[];for(let yy=0;yy<ROWS;yy++)for(let xx=0;xx<COLS;xx++){if(reach.has(xx,yy))continue;if(reach.tiles.some(t=>u.weapons.some(w=>inRange(w,Math.abs(t.x-xx)+Math.abs(t.y-yy)))))at.push({x:xx,y:yy})}info.attackTiles=at;mode='peek'}
      else{reach=null;mode='idle'}
    }else{info=null;reach=null;mode='idle'}
    renderConsole();return;
  }
  if(mode==='select'){
    if(x===sel.x&&y===sel.y){toMenu(false);return}
    if(reach.has(x,y)){
      busy=true;origin={x:sel.x,y:sel.y};const path=reach.path(x,y);reach=null;mode='moving';renderConsole();
      await animateMove(sel,path);sel.moved=true;delete sel.buf.accel;busy=false;toMenu(true);return;
    }
    if(u&&u.team==='ally'&&!u.acted){selectUnit(u);return}
    cancelSel();return;
  }
  if(mode==='target'){
    const t=targets&&targets.find(t=>t.x===x&&t.y===y);
    if(t){if(curW)forecast(sel,t,curW);else doRepair(sel,t);return}
    snd('cancel');mode='menu';curW=null;targets=null;renderConsole();
  }
}

/* ================= BATTLE SCENE ================= */
const bcv=$('bcv'),bctx=bcv.getContext('2d');
function playBattle(att,def,strikes){
  return new Promise(resolve=>{
    const ov=$('battle');ov.hidden=false;
    const W_=bcv.clientWidth||640;const dpr=Math.min(2,window.devicePixelRatio||1);bcv.width=W_*dpr;bcv.height=W_*.56*dpr;
    const w=bcv.width,h=bcv.height;
    const L=att.team==='foe'?att:def,R=L===att?def:att; // enemy left, ally right
    const start={};start[att.id]=strikes.length>1?strikes[1].hpFrom:att.hp;start[def.id]=strikes[0].hpFrom;
    const D=1900;const total=strikes.length*D+500;let t0=performance.now(),done=false,parts=[],flash=0,shake=0,lastI=-1,impacted=-1;
    const terr=terOf(def.x,def.y);const sky=terr===TER.W?['#0f2f5c','#2f74b8','#164a7a']:terr===TER.F?['#0e2a1c','#3c7a4e','#21452c']:terr===TER.M?['#2b2440','#8a6a5a','#4a3c30']:terr===TER.C?['#121a30','#4a5a80','#2a3040']:['#10213a','#4f7fb0','#2f4f2f'];
    function finish(){if(done)return;done=true;ov.hidden=true;ov.onclick=null;resolve()}
    ov.onclick=finish;
    function sidePos(u){return u===L?{x:w*.25,y:h*.58,f:1}:{x:w*.75,y:h*.58,f:-1}}
    function frame(now){
      if(done)return;
      const el=now-t0;if(el>total){finish();return}
      const i=Math.min(strikes.length-1,Math.floor(el/D)),k=(el-i*D)/D,s=strikes[i];
      if(i!==lastI){lastI=i;$('bWho').textContent=s.att.pilot.name;$('bTxt').textContent=`「${s.line}」　${s.w.name}！`;snd(s.w.type==='格'?'slash':'beam')}
      const A=sidePos(s.att),T=sidePos(s.def),melee=s.w.type==='格';
      const impactK=melee?.5:.58;
      if(k>=impactK&&impacted<i&&el<strikes.length*D){impacted=i;
        if(s.hit){flash=1;shake=s.crit?1:.6;snd('hit');for(let n=0;n<26;n++)parts.push({x:T.x,y:T.y-h*.05,vx:(Math.random()-.5)*w*.012,vy:(Math.random()-.8)*h*.02,life:1,c:Math.random()<.5?'#fff2b0':'#ff9a3d'})}
        else snd('miss')}
      // hp interp
      const disp={...start};
      for(let j=0;j<strikes.length;j++){const sj=strikes[j];const sk=j<i?1:j>i?0:clamp((k-impactK)/.2,0,1);if(j<=i)disp[sj.def.id]=Math.round(sj.hpFrom+(sj.hpTo-sj.hpFrom)*sk)}
      // background
      const c=bctx;c.save();
      if(shake>0){c.translate((Math.random()-.5)*w*.02*shake,(Math.random()-.5)*h*.02*shake);shake*=.9}
      const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,sky[0]);g.addColorStop(.62,sky[1]);g.addColorStop(.62,sky[2]);g.addColorStop(1,'#000');c.fillStyle=g;c.fillRect(-20,-20,w+40,h+40);
      c.strokeStyle='#ffffff22';c.lineWidth=2*dpr;for(let n=0;n<14;n++){const yy=(n*73%100)/100*h*.6,xx=((n*137+el*.9*(A.f))%(w*1.4))-w*.2;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx-A.f*w*.12,yy);c.stroke()}
      // units
      for(const u of[L,R]){
        const p=sidePos(u);let x=p.x,y=p.y,alpha=1;
        if(u===s.att&&melee){const dk=k<.2?0:k<impactK?(k-.2)/(impactK-.2):k<.75?1:1-(k-.75)/.25;x+=(T.x-p.x)*.62*Math.max(0,Math.min(1,dk))}
        if(u===s.def&&!s.hit&&k>impactK-.12&&k<.9){y-=h*.16*Math.sin(Math.min(1,(k-(impactK-.12))/.5)*Math.PI)}
        if(u===s.def&&s.kill&&k>.7){alpha=Math.max(0,1-(k-.7)/.25)}
        if(strikes.some((sj,j)=>j<i&&sj.kill&&sj.def===u))alpha=0;
        if(alpha<=0)continue;
        c.save();c.globalAlpha=alpha;c.translate(x,y+(u.air?Math.sin(now/250)*h*.02:0));
        c.fillStyle='#0005';c.beginPath();c.ellipse(0,h*.22,h*.16,h*.03,0,0,7);c.fill();
        const sc=h*(u.boss?.24:.19);c.scale(p.f*sc*(u.kind==='drone'?1:1),sc);
        if(u===s.def&&s.hit&&k>impactK&&k<impactK+.08)c.filter='brightness(3)';
        drawMech(c,u,now);c.restore();
      }
      // projectiles
      if(!melee&&k>.25&&k<impactK+.04){
        const pk=clamp((k-.25)/(impactK-.25),0,1),sx=A.x+A.f*h*.15,sy=A.y-h*.08,ex=T.x+(s.hit?0:-T.f*0),ey=T.y-h*.05-(s.hit?0:h*.1);
        const fx=s.w.fx;
        if(fx==='beam'||fx==='blast'){const bw=fx==='blast'?h*.09:h*.03;c.strokeStyle=fx==='blast'?'#ffd36b':'#8ff3ff';c.lineCap='round';c.lineWidth=bw;c.globalAlpha=.85;c.beginPath();c.moveTo(sx,sy);c.lineTo(sx+(ex-sx)*pk,sy+(ey-sy)*pk);c.stroke();c.strokeStyle='#fff';c.lineWidth=bw*.35;c.stroke();c.globalAlpha=1}
        else if(fx==='bullet'){for(let n=0;n<5;n++){const q=clamp(pk-n*.08,0,1);if(q<=0)continue;circ(c,sx+(ex-sx)*q,sy+(ey-sy)*q+Math.sin(n*9)*h*.01,h*.012,'#ffe680')}}
        else if(fx==='missile'||fx==='shell'){for(let n=0;n<(fx==='missile'?3:1);n++){const q=clamp(pk-n*.1,0,1);const arc=Math.sin(q*Math.PI)*h*(fx==='shell'?.3:.12)*(n%2?1:-1);const mx=sx+(ex-sx)*q,my=sy+(ey-sy)*q-Math.abs(arc);c.fillStyle='#ddd';c.fillRect(mx-h*.02,my-h*.008,h*.04,h*.016);circ(c,mx-A.f*h*.03,my,h*.012,'#ff9a3d')}}
        else{circ(c,sx+(ex-sx)*pk,sy+(ey-sy)*pk,h*.02,'#fff')}
      }
      if(melee&&k>impactK-.02&&k<impactK+.12&&s.hit){c.strokeStyle='#fff';c.lineWidth=h*.015;c.beginPath();c.moveTo(T.x-h*.18,T.y-h*.25);c.lineTo(T.x+h*.18,T.y+h*.1);c.stroke()}
      // explosion
      if(s.kill&&k>.65){const ek=(k-.65)/.35;for(let n=0;n<3;n++){c.globalAlpha=Math.max(0,1-ek);circ(c,T.x+Math.sin(n*2.1)*h*.06,T.y-h*.05+Math.cos(n*1.7)*h*.05,h*(.08+ek*.3)*(1-n*.2),['#fff3c4','#ffb347','#ff5a3d'][n])}c.globalAlpha=1;if(!s._boom){s._boom=1;snd('boom')}}
      // particles
      for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=h*.0009;p.life-=.03;if(p.life>0){c.globalAlpha=p.life;c.fillStyle=p.c;c.fillRect(p.x,p.y,h*.012,h*.012)}}c.globalAlpha=1;parts=parts.filter(p=>p.life>0);
      c.restore();
      if(flash>0){c.fillStyle=`rgba(255,255,255,${flash*.5})`;c.fillRect(0,0,w,h);flash*=.82}
      // damage text
      if(k>impactK&&k<1){const tk=(k-impactK)/(1-impactK);c.font=`${h*(s.crit?.12:.1)}px DotGothic16,monospace`;c.textAlign='center';c.lineWidth=h*.012;c.strokeStyle='#000';const tx=T.x,ty=T.y-h*.32-tk*h*.05;const txt=s.hit?String(s.dmg):'MISS';c.strokeText(txt,tx,ty);c.fillStyle=s.hit?(s.crit?'#ffc23d':'#fff'):'#9fc3ff';c.fillText(txt,tx,ty);if(s.crit){c.font=`${h*.05}px DotGothic16,monospace`;c.strokeText('CRITICAL!',tx,ty-h*.1);c.fillText('CRITICAL!',tx,ty-h*.1)}}
      // HUD
      const bar=(u,x,al)=>{const bw=w*.4,bh=h*.035,bx=al==='l'?x:x-bw,v=disp[u.id];c.fillStyle='#000a';c.fillRect(bx-4,h*.03-4,bw+8,h*.12);c.font=`${h*.045}px DotGothic16,monospace`;c.textAlign=al==='l'?'left':'right';c.fillStyle=u.team==='ally'?'#45aaff':'#ff5163';c.fillText(u.name,al==='l'?bx:bx+bw,h*.07);c.fillStyle='#e6edf7';c.textAlign=al==='l'?'right':'left';c.fillText(`${v}/${u.maxHp}`,al==='l'?bx+bw:bx,h*.07);c.fillStyle='#222';c.fillRect(bx,h*.09,bw,bh);const f=v/u.maxHp;c.fillStyle=f>.5?'#5fe08a':f>.25?'#ffc23d':'#ff5163';c.fillRect(al==='l'?bx:bx+bw*(1-f),h*.09,bw*f,bh)};
      bar(L,w*.04,'l');bar(R,w*.96,'r');
      if(k<.45){c.globalAlpha=Math.min(1,k*6);c.font=`${h*.06}px DotGothic16,monospace`;c.textAlign='center';const wy=h*.9;c.fillStyle='#000b';const tw=c.measureText(s.w.name).width;c.fillRect(A.x-tw/2-h*.03,wy-h*.065,tw+h*.06,h*.09);c.fillStyle=s.att.team==='ally'?'#8fd0ff':'#ff9aa5';c.fillText(s.w.name,A.x,wy);c.globalAlpha=1}
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ================= TURN FLOW ================= */
async function endPlayerPhase(){
  if(busy||over)return;
  busy=true;sel=null;reach=null;info=null;mode='busy';closeSheet();phase='enemy';renderConsole();
  await banner('ENEMY PHASE','TURN '+turn,'#ff5163');
  startOfPhase('foe');
  for(const e of alive('foe')){
    if(over)break;if(e.dead)continue;
    await enemyAct(e);
  }
  if(over){busy=false;return}
  for(const e of alive('foe'))e.acted=false;
  turn++;phase='player';
  for(const u of alive('ally')){u.acted=false;u.moved=false;u.buf={...(u.buf.dodge?{dodge:1}:{}),...(u.buf.dbl?{dbl:1}:{})}}
  sel=null;renderConsole();
  await banner('PLAYER PHASE','TURN '+turn,'#45aaff');
  startOfPhase('ally');
  mode='idle';busy=false;renderConsole();
}
function startOfPhase(team){
  for(const u of alive(team)){
    if(!u.air&&terOf(u.x,u.y).heal){const hh=Math.round(u.maxHp*.1),ee=Math.round(u.maxEn*.1);u.hp=Math.min(u.maxHp,u.hp+hh);u.en=Math.min(u.maxEn,u.en+ee);floats.push({x:u.x,y:u.y,text:'+'+hh,color:'#5fe08a',t0:performance.now()})}
    if(team==='ally')u.sp=Math.min(u.maxSp,u.sp+5);
    u.en=Math.min(u.maxEn,u.en+5);
  }
}
async function enemyAct(e){
  const guard=e.guard&&turn<3&&!alive('ally').some(p=>dist(p,e)<=6);
  if(e.guard&&!guard)e.guard=false;
  const r=computeReach(e,guard);
  let best=null;
  for(const t of r.tiles){
    const ox=e.x,oy=e.y;e.x=t.x;e.y=t.y;
    for(const p of alive('ally')){const d=Math.abs(t.x-p.x)+Math.abs(t.y-p.y);
      for(const w of e.weapons){if(usable(e,w)||!inRange(w,d))continue;
        const hr=hitRate(e,p,w),dm=baseDmg(e,p,w);let sc=dm*hr/100;if(dm>=p.hp)sc+=2500*hr/100;if(p.key==='grand')sc*=1.1;
        const cw=bestWeapon(p,e,d);if(cw)sc-=baseDmg(p,e,cw)*hitRate(p,e,cw)/100*.3;
        sc+=terOf(t.x,t.y).e*3;
        if(!best||sc>best.sc)best={sc,t,p,w}}}
    e.x=ox;e.y=oy;
  }
  sel=e;renderConsole();await sleep(280);
  if(best){
    await animateMove(e,r.path(best.t.x,best.t.y));await sleep(150);
    let choice={mode:'counter'};
    if(settings.manualDef)choice={mode:await defenseChoice(e,best.p,best.w)};
    await combat(e,best.p,best.w,choice);
  }else if(!guard){
    let tgt=null,td=1e9;for(const p of alive('ally')){const d=dist(p,e);if(d<td){td=d;tgt=p}}
    if(tgt){let bt=null,bd=1e9;for(const t of r.tiles){const d=Math.abs(t.x-tgt.x)+Math.abs(t.y-tgt.y)-terOf(t.x,t.y).e*.02;if(d<bd){bd=d;bt=t}}
      if(bt)await animateMove(e,r.path(bt.x,bt.y))}
  }
  e.acted=true;sel=null;renderConsole();await sleep(120);
}
function defenseChoice(a,d,w){
  return new Promise(res=>{
    const f=forecastHtml(a,d,w,'counter');
    const cw=bestWeapon(d,a,dist(a,d));
    openSheet(`<div class="sh-title"><span>敵の攻撃！　${d.name}の対応</span></div>${f.html}
    <div class="hint" style="margin-top:8px">防御：被ダメージ半減／回避：敵の命中率半減（どちらも反撃なし）</div>
    <div class="sh-actions"><button class="btn pri" data-def="counter" ${cw?'':'disabled'}>反撃</button><button class="btn" data-def="defend">防御</button><button class="btn" data-def="evade">回避（${hitRate(a,d,w,'evade')}%）</button></div>`);
    sheet._def=res;
  });
}

function titleArt(){
  const c=$('tcv'),dpr=Math.min(2,window.devicePixelRatio||1),W_=c.clientWidth||400;c.width=W_*dpr;c.height=W_*.5*dpr;const x=c.getContext('2d'),w=c.width,h=c.height;
  const demo=k=>({kind:TPL[k].kind,col:TPL[k].col});
  function f(now){if($('title').hidden)return;x.clearRect(0,0,w,h);
    const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0a1019');g.addColorStop(1,'#1a2a44');x.fillStyle=g;x.fillRect(0,0,w,h);
    x.strokeStyle='#45aaff22';x.lineWidth=dpr;for(let i=0;i<12;i++){x.beginPath();x.moveTo(0,h*.8+i*i*dpr);x.lineTo(w,h*.8+i*i*dpr);x.stroke()}
    const draw=(k,px,py,s,fl)=>{x.save();x.translate(px,py+Math.sin(now/600+px)*h*.015);x.scale(s*fl,s);drawMech(x,demo(k),now);x.restore()};
    draw('sylph',w*.24,h*.56,h*.26,1);draw('raven',w*.8,h*.3,h*.16,-1);draw('bulwark',w*.74,h*.66,h*.2,-1);draw('grand',w*.5,h*.5,h*.4,1);
    requestAnimationFrame(f)}
  requestAnimationFrame(f);
}
